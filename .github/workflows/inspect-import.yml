name: Inspect staged corpus import

on:
  push:
    branches: [automation/import-corpus-v0.1.0]
    paths: [.github/workflows/inspect-import.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package interrupted transport without executing its contents
        run: |
          mkdir import-inspection
          tar -czf import-inspection/staged-payload.tar.gz .import
          sha256sum .import/payload/*.b64 > import-inspection/chunk-sha256.txt
          wc -c .import/payload/*.b64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-corpus-payload
          path: import-inspection/
          retention-days: 7
          if-no-files-found: error
